# CI/CD workflow
#
# Triggers and what they do:
#
#   Pull request or push to "main"
#     - lint:  Ruff checks (code and formatting).
#     - test:  Pytest on Linux, MacOS and Windows.
#     - build: sdist and wheel, validated with Twine, checked against the version and
#              smoke-tested by installing the wheel. Nothing is published.
#
#   Release candidate tag (vA.B.CrcD, e.g. v1.2.3rc1)
#     - Same checks as above.
#     - installer: the Briefcase installers are built only to validate that they can be
#                  built (they are kept as workflow artifacts and are not released).
#     - publish-testpypi: the sdist and wheel are published to Test PyPI, only if all the
#                         previous jobs succeed.
#
#   Release tag (vA.B.C, e.g. v1.2.3)
#     - Same checks as above, including the installers.
#     - publish-pypi: the sdist and wheel are published to PyPI.
#     - github-release: a GitHub release is created, with generated notes and these assets:
#         - sdist and wheel;
#         - installers: Debian package (Ubuntu 26.04), MacOS DMG and Windows MSI;
#         - source code archives (zip and tar.gz), which GitHub adds automatically.
#
# Any other tag only runs lint, test and build.
#
# The package version is not set in the repository; it is derived from the Git tag by
# hatch-vcs, so a release is made by pushing a tag.
#
# Requirements:
#   - "testpypi" and "pypi" GitHub environments, each with a trusted publisher configured
#     on Test PyPI / PyPI for this repository and this workflow file name (ci-cd.yml). No
#     API tokens are used.
#   - The installers are only ad-hoc signed (not signed with a developer certificate, and
#     not notarized), so MacOS and Windows will warn users when opening them.

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Headless Qt, as CI runners have no display
  QT_QPA_PLATFORM: offscreen

jobs:
  # Classify the tag: "release" (vA.B.C), "rc" (vA.B.CrcD) or "none" (not a tag, or any other tag)
  context:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - id: kind
        run: |
          kind=none
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            kind=release
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            kind=rc
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --locked --only-group dev ruff check .
      - run: uv run --locked --only-group dev ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The full history is needed for hatch-vcs to compute the version
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: uv sync --locked
      - run: uv run --no-sync pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          ls dist
          ls dist/screen_presenter-"$expected"-*.whl dist/screen_presenter-"$expected".tar.gz
      - name: Smoke-test the wheel
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" --no-deps dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "import screen_presenter; print(screen_presenter.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Installers (Briefcase); built for rc tags only to validate them early, and released for final tags
  installer:
    needs: [context, lint, test, build]
    if: needs.context.outputs.kind != 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Debian package uses the system Python, so the target must provide Python 3.14
          - os: ubuntu-latest
            label: linux-x64
            briefcase_args: linux system --target ubuntu:26.04
          - os: macos-latest
            label: macos-universal
            briefcase_args: macOS
          - os: windows-latest
            label: windows-x64
            briefcase_args: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Running the project also generates src/screen_presenter/_version.py, which Briefcase bundles
      - name: Build the installer
        env:
          BRIEFCASE_ARGS: ${{ matrix.briefcase_args }}
        run: |
          uv run --locked --no-dev --group package \
            briefcase package $BRIEFCASE_ARGS --adhoc-sign --no-input
      - name: Rename the installer
        env:
          LABEL: ${{ matrix.label }}
        run: |
          mkdir out
          for file in dist/*; do
            ext="${file##*.}"
            if [[ "$ext" == deb ]]; then
              cp "$file" out/
            else
              cp "$file" "out/screen-presenter-$GITHUB_REF_NAME-$LABEL.$ext"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish-testpypi:
    needs: [context, lint, test, build, installer]
    if: needs.context.outputs.kind == 'rc'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # Trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [context, lint, test, build, installer]
    if: needs.context.outputs.kind == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: assets/
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: assets/
          merge-multiple: true
      # GitHub adds the source code archives (zip and tar.gz) to every release automatically
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --generate-notes
