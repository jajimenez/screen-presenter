[project]
name = "screen-presenter"
description = "Desktop application that shows your camera as a presenter overlay, so you can record your screen with any tool."
readme = "README.md"
authors = [
    { name = "Jose A. Jimenez" }
]
license = "MIT"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3.14"
]
dynamic = ["version"]  # Version is generated from the Git tag (hatch-vcs)
dependencies = [
    "PySide6>=6.10.0,<6.12.0"
]

[dependency-groups]
dev = [
    "ruff",
    "pytest"
]
package = [
    "briefcase"
]

[project.scripts]
screen-presenter = "screen_presenter.app:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"  # PyPI rejects local versions such as "+1234"

[tool.hatch.build.hooks.vcs]
version-file = "src/screen_presenter/_version.py"

[tool.briefcase]
bundle = "io.github.jajimenez"
url = "https://github.com/jajimenez/screen-presenter"
license_files = ["LICENSE"]

# The version, license and dependencies are taken from the [project] section
[tool.briefcase.app.screen-presenter]
formal_name = "Screen Presenter"
long_description = """\
Desktop application that shows your camera as a presenter overlay, so you can record \
your screen with any tool.
"""
sources = ["src/screen_presenter"]
icon = "packaging/icon"
permission.camera = "Screen Presenter needs camera access to display your camera video on screen."

# The PySide6 wheels require macOS 13 or later
[tool.briefcase.app.screen-presenter.macOS]
min_os_version = "13.0"

# The Linux package uses the system Python, so the target must provide Python 3.14 or later
[tool.briefcase.app.screen-presenter.linux.system.debian]
system_runtime_requires = [
    "libegl1",
    "libgl1",
    "libdbus-1-3",
    "libfontconfig1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libxcb-cursor0",
    "libxcb-icccm4",
    "libxcb-image0",
    "libxcb-keysyms1",
    "libxcb-randr0",
    "libxcb-render-util0",
    "libxcb-shape0",
    "libxcb-xinerama0",
    "libxcb-xkb1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
